name: Portable Windows ZIP

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  portable:
    name: Windows x64 portable archive
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set up MSVC build environment
        uses: microsoft/setup-msbuild@v2
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup default 1.96.0
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Restore backend
        shell: pwsh
        run: dotnet restore .\KM.Editor.slnx
      - name: Validate synchronized version
        shell: pwsh
        run: pnpm run check:version
      - name: Build unbundled application and self-contained bridge
        shell: pwsh
        run: pnpm --dir apps/desktop exec tauri build --ci --no-bundle --no-sign
      - name: Assemble portable archive
        shell: pwsh
        run: .\scripts\Build-KmPortable.ps1 -CargoTargetDirectory $env:CARGO_TARGET_DIR -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'portable-dist')
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KM-Editor-Portable-windows-x64
          path: portable-dist/*.zip
          if-no-files-found: error
          retention-days: 30
